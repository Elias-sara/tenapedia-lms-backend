quizzes:
  - title: "Advanced Pharmacological Mechanisms Assessment"
    moduleId: null  # Will be populated during seeding
    moduleTitle: "Advanced Pharmacological Mechanisms"
    description: "Comprehensive evaluation of advanced pharmacological knowledge and drug interaction principles for specialized pharmacy practice."
    duration: 45
    passingScore: 70
    totalPoints: 10
    timeLimit: 45
    maxAttempts: 3
    showExplanation: true
    isPublished: true
    studentsEnrolled:
      - "initial_student_quiz_1"
      - "initial_student_quiz_2"
    questions:
      - type: "multiple-choice"
        text: "What is the primary mechanism of drug absorption in the small intestine?"
        options:
          - text: "Active transport"
          - text: "Passive diffusion"
          - text: "Facilitated diffusion"
          - text: "Endocytosis"
        correctAnswer: "Passive diffusion"
        explanation: "Most drugs are absorbed through the small intestine via passive diffusion, moving from high to low concentration."
        points: 1

      - type: "true-false"
        text: "Receptor pharmacology plays a crucial role in understanding drug interactions."
        options:
          - text: "True"
          - text: "False"
        correctAnswer: "True"
        explanation: "Receptor pharmacology helps explain how drugs interact with specific cellular receptors to produce therapeutic effects."
        points: 1

      - type: "multiple-choice"
        text: "What is the primary goal of pharmacodynamic studies?"
        options:
          - text: "Measuring drug metabolism"
          - text: "Understanding drug-receptor interactions"
          - text: "Calculating drug dosage"
          - text: "Predicting side effects"
        correctAnswer: "Understanding drug-receptor interactions"
        explanation: "Pharmacodynamics focuses on how drugs interact with target receptors and the resulting physiological changes."
        points: 1
    createdAt: "2025-01-10"
    updatedAt: "2025-01-10"

  - title: "Clinical Medication Management Assessment"
