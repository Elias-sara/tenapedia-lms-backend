quizzes:
  - title: "Advanced Maternal Physiological Mechanisms Assessment"
    moduleId: null  # Will be populated during seeding
    moduleTitle: "Advanced Maternal Physiological Mechanisms"
    description: "Comprehensive evaluation of advanced maternal physiological knowledge and reproductive health principles for specialized nursing practice."
    duration: 45
    passingScore: 70
    totalPoints: 10
    timeLimit: 45
    maxAttempts: 3
    showExplanation: true
    isPublished: true
    studentsEnrolled:
      - "initial_student_quiz_1"
      - "initial_student_quiz_2"
    questions:
      - type: "multiple-choice"
        text: "What hormonal changes are most significant during early pregnancy?"
        options:
          - text: "Increased estrogen and progesterone"
          - text: "Decreased testosterone"
          - text: "Elevated cortisol levels"
          - text: "Reduced insulin sensitivity"
        correctAnswer: "Increased estrogen and progesterone"
        explanation: "Estrogen and progesterone levels rise significantly during early pregnancy to support fetal development and maternal physiological changes."
        points: 1

      - type: "true-false"
        text: "Placental development plays a crucial role in maternal physiological adaptation."
        options:
          - text: "True"
          - text: "False"
        correctAnswer: "True"
        explanation: "The placenta is a critical organ that supports fetal development and mediates numerous maternal physiological adaptations during pregnancy."
        points: 1

      - type: "multiple-choice"
        text: "What is the primary function of relaxin during pregnancy?"
        options:
          - text: "Stimulating milk production"
          - text: "Softening pelvic ligaments"
          - text: "Regulating blood sugar"
          - text: "Increasing bone density"
        correctAnswer: "Softening pelvic ligaments"
        explanation: "Relaxin helps soften and relax pelvic ligaments, preparing the body for childbirth by increasing joint mobility."
        points: 1
    createdAt: "2025-01-10"
    updatedAt: "2025-01-10"

